# Release: on a v* tag, build the native binary on every platform, publish a GitHub release with
# the binaries, their checksums and the rendered AUR PKGBUILD, then publish the npm packages.
# A manual run must be started on a v* tag; the version comes from the tag name.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match VERSION
        run: |
          grep -q "val VERSION = \"${GITHUB_REF_NAME#v}\"" Main.scala \
            || { echo "ref $GITHUB_REF_NAME does not match VERSION in Main.scala; run on a v<version> tag"; exit 1; }
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev
      - name: Build
        run: >
          scala-cli --power package --native-image . -o polio -f
          --graalvm-java-version 25 --graalvm-version 25.0.1
          --graalvm-args --no-fallback
          --graalvm-args -Os
          --graalvm-args -Dsun.misc.unsafe.memory.access=allow
      - name: Smoke test
        run: ./polio version
      - uses: actions/upload-artifact@v4
        with:
          name: polio-${{ matrix.target }}
          path: polio

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assets, checksums and PKGBUILD
        run: |
          mkdir dist
          for dir in artifacts/polio-*; do cp "$dir/polio" "dist/${dir#artifacts/}"; done
          (cd dist && sha256sum polio-* > SHA256SUMS)
          sed -e "s/@VERSION@/${GITHUB_REF_NAME#v}/" \
              -e "s/@SHA256_X64@/$(sha256sum dist/polio-linux-x64 | cut -d' ' -f1)/" \
              -e "s/@SHA256_ARM64@/$(sha256sum dist/polio-linux-arm64 | cut -d' ' -f1)/" \
              -e "s/@SHA256_LICENSE@/$(sha256sum LICENSE | cut -d' ' -f1)/" \
              packaging/aur/PKGBUILD > dist/PKGBUILD
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Publishes through npm trusted publishing: the job authenticates with the OIDC token GitHub
  # issues for this workflow, so no npm token is stored. Each package on npmjs.com must list this
  # repository and workflow file as its trusted publisher.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or newer, the first version that supports trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: The npm shim
        run: node --test npm/test/*.test.mjs
      - name: Assemble the packages
        run: node npm/assemble.mjs "${GITHUB_REF_NAME#v}" artifacts dist/npm
      - name: Publish the platform packages, then the main one
        run: |
          version=${GITHUB_REF_NAME#v}
          publish() {
            name=$(node -p "require('./$1/package.json').name")
            if npm view "$name@$version" version > /dev/null 2>&1
            then echo "$name@$version is already published"
            else npm publish "$1" --access public
            fi
          }
          for pkg in dist/npm/polio-*; do publish "$pkg"; done
          publish dist/npm/polio
